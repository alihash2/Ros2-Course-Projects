# Per-robot Gazebo <-> ROS 2 bridge (Issue 3).
#
# Run ONE instance per robot with:
#   -r __ns:=/robotN -p expand_gz_topic_names:=true -p config_file:=<this file>
# Relative names then resolve to /robotN/<topic> on BOTH the ROS and the
# Gazebo side (the model template gives every Gazebo topic a robot1/robot2
# prefix), so the two robots cannot crosstalk.
#
# TF is deliberately NOT bridged here - both robots publish odom->base TF
# into the single global /tf (see config/sim_bridge.yaml), which keeps one
# connected tree for tf2_tools/view_frames.
#
# cmd_vel chain: Nav2 (Twist) -> /robotN/cmd_vel -> cmd_vel_relay ->
# /robotN/cmd_vel_stamped (TwistStamped) -> bridge -> gz /robotN/cmd_vel.

# DiffDrive (gz) -> odometry (frame ids come from the model template:
# odom_robotN, robotN/base_footprint)
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# JointStatePublisher (gz) -> wheel joints for robot_state_publisher
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Nav2 (TwistStamped on the stamped sibling) -> DiffDrive (gz)
- ros_topic_name: "cmd_vel_stamped"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# IMU sensor (gz)
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# GPU lidar (gz)
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera (ms04 bridges camera_info only; Issue 3 adds image_raw for QR vision)
- ros_topic_name: "camera/camera_info"
  gz_topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/image_raw"
  gz_topic_name: "camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
