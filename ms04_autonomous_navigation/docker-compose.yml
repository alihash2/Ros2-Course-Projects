version: '3.8'

services:
  navigation_stack:
    build:
      context: .                        # Sets build view to the root folder
      dockerfile: docker/Dockerfile     # Points to your hidden recipe
    container_name: ms04_evaluation
    network_mode: "host"
    ipc: "host"
    pid: "host"
    environment:
      - DISPLAY=${DISPLAY}
      # Hybrid Graphics Architecture Pass-through (Ryzen iGPU + NVIDIA dGPU)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1       # Forces discrete GPU utilization
      - __GLX_VENDOR_LIBRARY_NAME=nvidia  # Sets OpenGL backend onto NVIDIA core
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ~/.Xauthority:/root/.Xauthority:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash -c "source /test_ws/install/setup.bash && ros2 run ms04_autonomous_navigation mission_control_gui.py"

