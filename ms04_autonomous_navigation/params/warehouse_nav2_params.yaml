# Nav2 parameters for navigation in the WAREHOUSE environment.
# Fast tune: long straightaways, pallet clearance, higher transit speeds.
# Differences vs the generic exploration profile:
#   - higher linear speed & turns (max_vel_x 0.9, max_vel_theta 1.8)
#   - larger acceleration limits & longer sim_time for high-speed paths
#   - bigger inflation on local costmap to sweep wide around pallet racks
# Localization via map_server + AMCL against maps/warehouse_map.yaml.
# Controller chain: controller->cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#                   -> collision_monitor -> cmd_vel_raw -> relay -> /cmd_vel (gz)

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.40
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.9
      max_vel_y: 0.0
      max_vel_theta: 1.8
      min_speed_xy: 0.0
      max_speed_xy: 0.9
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -3.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 14
      vy_samples: 4
      vtheta_samples: 16
      sim_time: 2.2
      sim_granularity: 0.03
      angular_sim_granularity: 0.06
      path_distance_bias: 28.0
      goal_distance_bias: 20.0
      occdist_scale: 0.09
      stop_on_oscillation: true
      oscillation_reset_dist: 0.05
      forward_point_distance: 0.35
      scaling_speed: 0.2
      max_scaling_factor: 0.2
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.1
      xy_goal_tolerance: 0.30
      short_circuit_trajectory_evaluation: true
      trans_stopped_velocity: 0.01
      theta_stopped_velocity: 0.01
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      RotateToGoal:
        plugin: "dwb_critics::RotateToGoalCritic"
        enabled: true
      Oscillation:
        plugin: "dwb_critics::OscillationCritic"
        enabled: true
        forward_pos_distance: 0.45
        forward_neg_distance: 0.45
        backward_pos_distance: 0.45
        backward_neg_distance: 0.45
      BaseObstacle:
        plugin: "dwb_critics::BaseObstacleCritic"
        enabled: true
        scale: 0.02
        sum_scores: false
      GoalAlign:
        plugin: "dwb_critics::GoalAlignCritic"
        enabled: true
        forward_point_distance: 0.35
        scale: 3.0
        sum_scores: false
      PathAlign:
        plugin: "dwb_critics::PathAlignCritic"
        enabled: true
        forward_point_distance: 0.35
        scale: 3.0
        sum_scores: false
      PathDist:
        plugin: "dwb_critics::PathDistCritic"
        enabled: true
        scale: 28.0
        sum_scores: false
        short_circuit_trajectory_evaluation: true
      GoalDist:
        plugin: "dwb_critics::GoalDistCritic"
        enabled: true
        scale: 20.0
        sum_scores: false
        short_circuit_trajectory_evaluation: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 2.0
    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 2.0
    wait:
      plugin: "nav2_behaviors::Wait"
      simulate_ahead_time: 2.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    max_rotational_vel: 1.4
    min_rotational_vel: 0.5
    rotational_acc_lim: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 120.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # Built-in BT plugins auto-load in Jazzy; only custom ones belong here.
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    use_stamped_vel: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.9, 0.0, 1.8]
    min_velocity: [-0.9, 0.0, -1.8]
    max_accel: [2.0, 0.0, 2.5]
    max_decel: [-3.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_raw"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.8
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True

# AMCL localization against maps/warehouse_map.yaml (warehouse world origin [-4.039, -9.024]).
# yaml_filename for map_server is supplied by the navigation launch file.
amcl:
  ros__parameters:
    use_sim_time: true
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.22
      initial_transform_timeout: 120.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      plugins: ["voxel_layer", "inflation_layer"]
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      initial_transform_timeout: 120.0
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True